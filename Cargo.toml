[workspace]
resolver = "2"
members = [
    "crates/rustrain-abi",
    "crates/rustrain-ops",
    "crates/rustrain-parallel",
    "crates/rustrain-plan",
    "crates/rustrain-model",
    "crates/rustrain-runtime",
    "crates/rustrain-kernels",
    "crates/rustrain-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Core crates: no tch, no libtorch, no cuda in their dependency closure.
# See docs/design/kernel-first/spec.md, invariant I-1.
rustrain-abi = { path = "crates/rustrain-abi" }
rustrain-ops = { path = "crates/rustrain-ops" }
rustrain-parallel = { path = "crates/rustrain-parallel" }
rustrain-plan = { path = "crates/rustrain-plan" }
rustrain-model = { path = "crates/rustrain-model" }
rustrain-runtime = { path = "crates/rustrain-runtime" }
rustrain-kernels = { path = "crates/rustrain-kernels" }

anyhow = "1.0.98"
blake3 = "1.5"
clap = { version = "4.5.40", features = ["derive"] }
libloading = "0.8"
ndarray = { version = "0.16.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0"
toml = "0.8.23"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = "thin"
