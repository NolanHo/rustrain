weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 0.00000001
max_steps = 20
backend = "tch"
dtype = "bf16"
device = "cuda"
checkpoint_every = 0

[lora]
