[run]
name = "glm5_lora_sft_ep8"
base_dir = "/tmp/rustrain-runs"
seed = 42

[model]
name = "glm5_lora_sft_ep8"
architecture = "glm5_lora_sft_ep"
model_path = "/vePFS-mindverse/user/nolanho/models/GLM-5.2"
vocab_size = 151552
hidden_size = 6144
num_layers = 78
num_attention_heads = 32
num_key_value_heads = 32
intermediate_size = 18432
seq_len = 512
norm = "rmsnorm"
activation = "swiglu"
rope = true
rms_norm_eps = 0.000001

[train]
