[run]
name = "glm5_synth_bf16_test"
base_dir = "/tmp/rustrain-runs"
seed = 42

[model]
name = "glm5_synth_bf16_test"
architecture = "glm5_lora_sft_ep"
model_path = "/tmp/glm5-synthetic"
vocab_size = 154880
hidden_size = 256
num_layers = 4
num_attention_heads = 8
num_key_value_heads = 8
intermediate_size = 128
seq_len = 64
norm = "rmsnorm"
activation = "swiglu"
rope = true
rms_norm_eps = 0.000001

[train]
micro_batch_size = 1
global_batch_size = 1
gradient_accumulation_steps = 1
learning_rate = 0.000001
weight_decay = 0.0
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 0.00000001
max_steps = 5
backend = "tch"
dtype = "bf16"
device = "cuda"
checkpoint_every = 0

[lora]
target_layers = [0, 1, 2, 3]
rank = 8
alpha = 16
target_modules = ["q_a_proj", "q_b_proj", "kv_a_proj_with_mqa", "o_proj"]

[parallel]
tensor_model_parallel_size = 1
pipeline_model_parallel_size = 1
data_parallel_size = 1
expert_model_parallel_size = 1
context_parallel_size = 1
