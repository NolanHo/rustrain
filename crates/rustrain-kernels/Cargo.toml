[package]
name = "rustrain-kernels"
description = "Built-in operator provider: reference (pure Rust). The aten/torch plugin is not built here"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Invariant I-1: no tch / libtorch / cuda in the dependency closure.
[dependencies]
rustrain-abi.workspace = true
ndarray.workspace = true
thiserror.workspace = true

# The plugin must be dlopen-able by the framework's loader (contract C-1):
# publish a cdylib alongside the rlib the tests link against.
[lib]
crate-type = ["rlib", "cdylib"]

