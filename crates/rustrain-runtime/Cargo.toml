[package]
name = "rustrain-runtime"
description = "Executor, slot memory pool, stream and collective scheduling"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Invariant I-1: no tch / libtorch / cuda in the dependency closure.
# `libloading` only *loads* the CUDA driver at runtime (`device.rs`); it links
# nothing.
[dependencies]
rustrain-abi.workspace = true
rustrain-ops.workspace = true
rustrain-plan.workspace = true
rustrain-parallel.workspace = true
libloading.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rustrain-kernels.workspace = true
